<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>時計・気温</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #wrap {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #eee;
  }
  #time {
    font-size: 22vw;
    font-weight: 300;
    letter-spacing: 0.05em;
    line-height: 1;
  }
  #temp {
    font-size: 12vw;
    font-weight: 300;
    margin-top: 4vh;
    color: #9dd;
  }
  #temp .unit {
    font-size: 50%;
  }
  #date .day {
    font-size: 70%;
    vertical-align: 0.12em; /* 小さくした曜日を数字の上下中央に合わせて少し持ち上げる */
  }
  #date {
    align-self: flex-end;
    margin-right: 3vw;
    margin-bottom: 3vw; /* 日付と時刻の間隔 */
    line-height: 1;
    font-size: 9vw;
    font-weight: 300;
    color: #9dd;
    white-space: nowrap;
  }
  #status {
    position: absolute;
    bottom: 10px;
    font-size: 10px;
    color: #444;
    font-family: monospace;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="date">--/-- <span class="day">(-)</span></div>
  <div id="time">--:--</div>
  <div id="temp">--.-<span class="unit">&#8451;</span> --<span class="unit">%</span> --.-<span class="unit">m</span></div>
</div>
<div id="status"></div>

<script>
  // ==== 設定エリア ====
  // 気象庁アメダス観測点コード(豊中は湿度非観測のため、気温・湿度・風速がそろう大阪を使用)
  // 観測点一覧: https://www.jma.go.jp/bosai/amedas/const/amedastable.json
  var AMEDAS_STATION = "62078"; // 大阪
  var WEATHER_INTERVAL_MS = 10 * 60 * 1000; // 10分ごとに気温更新
  // ====================

  // ページ自動更新用バージョン。index.htmlを変更してpushするたびに値を変えること。
  // 端末が古いページを表示していても、新しい版が公開されていれば自動で読み込み直す。
  var APP_VERSION = "2026-11-14-4";
  var VERSION_CHECK_MS = 5 * 60 * 1000; // 5分ごとに確認

  function checkVersion() {
    if (typeof navigator.onLine === "boolean" && !navigator.onLine) return;
    // 毎回異なるURLにしてキャッシュを回避
    fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" })
      .then(function(res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function(html) {
        var m = html.match(/var APP_VERSION = "([^"]+)"/);
        if (m && m[1] !== APP_VERSION) {
          // 新しいURLで開き直すことで、古いキャッシュを使わせない
          location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
        }
      })
      .catch(function() { /* 確認失敗時は何もしない */ });
  }

  function updateClock() {
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, "0");
    var mm = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("time").textContent = hh + ":" + mm;

    var days = ["日", "月", "火", "水", "木", "金", "土"];
    var mo = String(now.getMonth() + 1).padStart(2, "0");
    var dd = String(now.getDate()).padStart(2, "0");
    document.getElementById("date").innerHTML =
      mo + "/" + dd + ' <span class="day">(' + days[now.getDay()] + ")</span>";
  }

  function updateWeather() {
    // Wi-Fiのみ運用のため、ネットワーク未接続時は無駄なfetchを避ける
    if (typeof navigator.onLine === "boolean" && !navigator.onLine) {
      document.getElementById("status").textContent = "オフライン";
      return;
    }

    fetch("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt")
      .then(function(res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function(latest) {
        // "2026-08-07T22:50:00+09:00" のようなISO形式を
        // マップJSONのファイル名形式 "20260807225000" に変換
        var fileName = latest.trim().replace(/[-:T]/g, "").replace(/\+.*$/, "");
        return fetch("https://www.jma.go.jp/bosai/amedas/data/map/" + fileName + ".json");
      })
      .then(function(res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function(data) {
        var station = data[AMEDAS_STATION];
        if (!station || !station.temp || station.temp[0] === null) {
          throw new Error("観測値なし");
        }
        var t = station.temp[0];
        var h = station.humidity ? station.humidity[0] : null;
        var w = station.wind ? station.wind[0] : null;

        function fmtDecimal(v, pad) {
          var sign = v < 0 ? "-" : "";
          var abs = Math.abs(v).toFixed(1);
          var parts = abs.split(".");
          var intPart = pad ? parts[0].padStart(2, "0") : parts[0];
          return sign + intPart + "." + parts[1];
        }
        function fmtInt(v) {
          var sign = v < 0 ? "-" : "";
          return sign + String(Math.abs(v)).padStart(2, "0");
        }

        var text = fmtDecimal(t, true) + '<span class="unit">&#8451;</span>';
        if (h !== null) text += " " + fmtInt(h) + '<span class="unit">%</span>';
        if (w !== null) text += " " + fmtDecimal(w, false) + '<span class="unit">m</span>';
        document.getElementById("temp").innerHTML = text;
        document.getElementById("status").textContent =
          "更新: " + new Date().toLocaleTimeString();
      })
      .catch(function(err) {
        document.getElementById("status").textContent = "取得失敗: " + err.message;
      });
  }

  updateClock();
  updateWeather();
  setInterval(updateClock, 1000);
  setInterval(updateWeather, WEATHER_INTERVAL_MS);
  checkVersion();
  setInterval(checkVersion, VERSION_CHECK_MS);
</script>
</body>
</html>
